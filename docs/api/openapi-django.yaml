          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VerificationReviewRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerificationReviewRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
          description: ''
components:
