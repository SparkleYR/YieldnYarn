      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
          description: ''
  /api/auth/users/:
    get:
      operationId: auth_users_list
      description: |-
        /api/auth/users/            (list, admin only)
        /api/auth/users/{id}/       (retrieve, partial_update — is_active only)

        Read/toggle only: email/phone/role edits and user creation/deletion are
        out of scope for this endpoint (registration owns creation).
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: role
        schema:
          type: string
          enum:
          - ADMIN
          - BUYER
          - SELLER
          - VERIFIER
        description: |-
          * `SELLER` - Seller
          * `BUYER` - Buyer
          * `ADMIN` - Admin
          * `VERIFIER` - Verifier
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminUserList'
          description: ''
  /api/auth/users/{id}/:
    get:
      operationId: auth_users_retrieve
      description: |-
        /api/auth/users/            (list, admin only)
        /api/auth/users/{id}/       (retrieve, partial_update — is_active only)

        Read/toggle only: email/phone/role edits and user creation/deletion are
        out of scope for this endpoint (registration owns creation).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
    patch:
      operationId: auth_users_partial_update
      description: |-
        /api/auth/users/            (list, admin only)
        /api/auth/users/{id}/       (retrieve, partial_update — is_active only)

        Read/toggle only: email/phone/role edits and user creation/deletion are
        out of scope for this endpoint (registration owns creation).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this user.
        required: true
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdminUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAdminUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAdminUserRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
          description: ''
  /api/catalog/listings/:
    get:
      operationId: catalog_listings_list
      description: |-
        /api/catalog/listings/                       (list, create — idempotent on client_uuid)
        /api/catalog/listings/{id}/                   (retrieve, update, destroy)
        /api/catalog/listings/{id}/evidence/          (GET list, POST file upload)
        /api/catalog/listings/{id}/grading/           (GET grading results)
        /api/catalog/listings/{id}/grading/trigger/   (POST -> triggers FastAPI grading)
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: seller
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          enum:
          - ACTIVE
          - DRAFT
          - EXPIRED
          - PENDING_GRADING
          - PENDING_VERIFICATION
          - SOLD
        description: |-
          * `DRAFT` - Draft
          * `PENDING_GRADING` - Pending Grading
          * `PENDING_VERIFICATION` - Pending Verification
          * `ACTIVE` - Active
          * `SOLD` - Sold
          * `EXPIRED` - Expired
      - in: query
        name: vertical
        schema:
          type: integer
      tags:
      - catalog
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedListingList'
          description: ''
    post:
