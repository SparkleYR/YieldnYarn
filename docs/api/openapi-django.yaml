          $ref: '#/components/schemas/UserProfile'
      required:
      - created_at
      - email
      - id
      - phone
      - role
    Bid:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        listing:
          type: integer
        commodity_name:
          type: string
          readOnly: true
        unit:
          type: string
          readOnly: true
        buyer:
          type: integer
          readOnly: true
        buyer_name:
          type: string
          readOnly: true
        proposed_by:
          type: integer
          readOnly: true
