        /api/orders/requirements/{id}/match/ (POST -> triggers FastAPI matching/allocation)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this requirement.
        required: true
      tags:
      - orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedRequirementRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedRequirementRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedRequirementRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Requirement'
          description: ''
    delete:
      operationId: orders_requirements_destroy
      description: |-
        /api/orders/requirements/            (list, create)
        /api/orders/requirements/{id}/       (retrieve, update, destroy)
        /api/orders/requirements/{id}/match/ (POST -> triggers FastAPI matching/allocation)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this requirement.
        required: true
      tags:
      - orders
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/orders/requirements/{id}/match/:
    post:
      operationId: orders_requirements_match_create
      description: |-
        Proxies to FastAPI's POST /compute/matching/allocate.

        Nothing else in this codebase ever calls the matching engine — the
        buyer requirements UI's own copy ("the matching engine finds
        sellers for you") was previously just aspirational text. A
        requirement staying unmatched (no listings yet, or none within
        price/grade/radius) is a normal, expected outcome, not an error —
        this always returns 200 with `matched: true/false`, mirroring how
        `catalog/views.py:trigger_grading` proxies FastAPI's grading call.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this requirement.
        required: true
      tags:
      - orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequirementRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RequirementRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RequirementRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Requirement'
          description: ''
  /api/pricing/price-points/:
    get:
      operationId: pricing_price_points_list
      description: |-
        GET  /api/pricing/price-points/  — list (read-only for any authenticated user)
        POST /api/pricing/price-points/  — admin manually enters a price
                                            (source=ADMIN_ENTERED use case)
      parameters:
      - in: query
        name: commodity
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: region
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: source
        schema:
          type: string
          enum:
          - ADMIN_ENTERED
          - AGMARKNET
          - CCI
        description: |-
          * `AGMARKNET` - AGMARKNET
          * `ADMIN_ENTERED` - Admin Entered
          * `CCI` - CCI
      - in: query
        name: vertical
        schema:
          type: integer
      tags:
      - pricing
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPricePointList'
          description: ''
    post:
      operationId: pricing_price_points_create
      description: |-
        GET  /api/pricing/price-points/  — list (read-only for any authenticated user)
        POST /api/pricing/price-points/  — admin manually enters a price
                                            (source=ADMIN_ENTERED use case)
      tags:
      - pricing
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PricePointRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PricePointRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PricePointRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PricePoint'
          description: ''
  /api/reputation/{user_id}/:
    get:
      operationId: reputation_retrieve
      description: GET /api/reputation/{user_id}/
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - reputation
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReputationScore'
          description: ''
  /api/verification/queue/:
    get:
      operationId: verification_queue_list
      description: |-
        GET /api/verification/queue/  (Verifier + Admin only)

        Returns an enriched view per listing — grade/confidence (derived via
        catalog/grading.py, §12), priority, a human-readable flagged reason, and
        evidence count — rather than a bare ListingSerializer, since that's what
        the verifier/admin queue UIs actually need to render without each
        fetching grading data separately per listing.
      tags:
      - verification
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VerificationQueueItem'
          description: ''
  /api/verification/queue/{listing_id}/review/:
    post:
      operationId: verification_queue_review_create
      description: |-
        POST /api/verification/queue/{listing_id}/review/

        Body: {"decision": "APPROVE"|"REJECT", "notes": str, "attribute_scores": {...}}
      parameters:
      - in: path
        name: listing_id
        schema:
          type: integer
        required: true
      tags:
