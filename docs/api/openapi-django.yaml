openapi: 3.0.3
info:
  title: MSME Marketplace API
  version: 1.0.0
  description: 'Django REST API: auth, catalog, orders/bids, disputes, notifications,
    pricing.'
paths:
  /api/auth/admin/stats/:
    get:
      operationId: auth_admin_stats_retrieve
      description: |-
        GET /api/auth/admin/stats/  (Admin only)

        Platform-wide counters for the admin dashboard. `revenue_delta_pct` is a
        real month-over-month comparison of REVENUE_STATUSES orders' total_price,
        not a placeholder — it's `None` (not 0) when last month had zero revenue
        to compare against, since a percentage change is undefined there.
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformStats'
          description: ''
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        POST /api/auth/login/ -> JWT access + refresh tokens.

        With `X-Auth-Mode: cookie` the refresh token is set as an httpOnly cookie
        instead of returned in the body.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MyTokenObtainPairRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MyTokenObtainPairRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MyTokenObtainPairRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      description: |-
        POST /api/auth/logout/ — revoke the refresh token (body or cookie) and
        clear the cookie. Always 204: logging out twice isn't an error.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequestRequest'
      security:
      - jwtAuth: []
      - {}
      responses:
        '204':
          description: Logged out
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: GET /api/auth/me/, PATCH /api/auth/me/ (phone + profile fields)
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: auth_me_partial_update
      description: GET /api/auth/me/, PATCH /api/auth/me/ (phone + profile fields)
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMeUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedMeUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMeUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/auth/password-reset/:
    post:
      operationId: auth_password_reset_create
      description: |-
        POST /api/auth/password-reset/  {email}

        Always returns 200 with the same generic message whether or not the
        email belongs to a real account — confirming/denying an email's
        existence here is a real account-enumeration vector, not a detail worth
        trading away for a slightly more specific response. Uses Django's own
        `default_token_generator` (the same primitive `PasswordResetView` uses
        for the stock HTML flow), just surfaced as a JSON API for this SPA.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/auth/password-reset/confirm/:
    post:
      operationId: auth_password_reset_confirm_create
      description: POST /api/auth/password-reset/confirm/  {uid, token, new_password}
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
  /api/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: |-
        POST /api/auth/refresh/ — body `{refresh}` (app) or the refresh cookie (web).

        Refresh tokens rotate and the old one is blacklisted, so a leaked refresh
        token stops working the next time the real client refreshes.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
