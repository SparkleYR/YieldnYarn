name: Lint Backend

on:
  push:
    paths:
      - "backend-django/**"
      - "backend-fastapi/**"
      - ".github/workflows/lint-backend.yml"
  pull_request:
    paths:
      - "backend-django/**"
      - "backend-fastapi/**"
      - ".github/workflows/lint-backend.yml"

jobs:
  ruff:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend-django, backend-fastapi]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned: each ruff release can widen the default rule set (see ruff.toml).
      - run: pip install ruff==0.15.8
      - name: Ruff
        working-directory: ${{ matrix.service }}
        run: ruff check .
