name: Docker Build

# Builds the three production images (without pushing) whenever something
# that goes into them changes, so a broken Dockerfile shows up before a
# deploy. The FastAPI image is built with the full ML stack (CPU torch).
on:
  push:
    paths:
      - "backend-django/**"
      - "backend-fastapi/**"
      - "web-app/**"
      - "ml-training/scripts/**"
      - "ml-training/checkpoints/**"
      - ".dockerignore"
      - ".github/workflows/docker-build.yml"
  pull_request:
    paths:
      - "backend-django/**"
      - "backend-fastapi/**"
      - "web-app/**"
      - "ml-training/scripts/**"
      - "ml-training/checkpoints/**"
      - ".dockerignore"
      - ".github/workflows/docker-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [django, fastapi, web]
        include:
          - service: django
            dockerfile: backend-django/Dockerfile
          - service: fastapi
            dockerfile: backend-fastapi/Dockerfile
          - service: web
            dockerfile: web-app/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: msme-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: FastAPI image loads the bundled graders
        if: matrix.service == 'fastapi'
        run: |
          docker run --rm msme-fastapi:ci python -c "
          from grading.classifier import load_grader
          for v in ('agriculture', 'textiles'):
              g = load_grader(v)
              assert g is not None, v
              print(v, sorted(g.attributes), g.analysis['mode'])
          "
