name: Seller App

on:
  push:
    paths:
      - "seller-app/**"
      - ".github/workflows/seller-app.yml"
  pull_request:
    paths:
      - "seller-app/**"
      - ".github/workflows/seller-app.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: seller-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # ubuntu-latest ships the Android SDK (ANDROID_HOME is preset).
      - name: Core unit tests (API client, offline sync, domain rules)
        run: ./gradlew --no-daemon :core:test
      - name: App unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: seller-app-debug-apk
          path: seller-app/app/build/outputs/apk/debug/*.apk
