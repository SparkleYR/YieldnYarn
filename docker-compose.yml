# Local development: `docker compose up -d` starts Postgres (+ PostGIS) only,
# and you run the services from source (see README).
#
# Whole stack from the production images:
#   docker compose --profile app up -d --build
#   -> web http://localhost:3000, API http://localhost:8000/api (docs at /api/docs/),
#      compute http://localhost:8001/compute
services:
  db:
    image: postgis/postgis:17-3.5
    container_name: msme-postgres
    environment:
      POSTGRES_DB: msme_marketplace
      POSTGRES_USER: msme_dev
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devpassword}
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U msme_dev -d msme_marketplace"]
      interval: 10s
      retries: 5

  django:
    profiles: ["app"]
    build:
      context: .
      dockerfile: backend-django/Dockerfile
    image: msme-django
    depends_on:
      db:
        condition: service_healthy
    environment: &backend-env
      DB_HOST: db
      DB_NAME: msme_marketplace
      DB_USER: msme_dev
      DB_PASSWORD: ${DB_PASSWORD:-devpassword}
      DATABASE_URL: postgresql://msme_dev:${DB_PASSWORD:-devpassword}@db:5432/msme_marketplace
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-compose-only-secret-change-me}
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,django
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      FASTAPI_BASE_URL: http://fastapi:8001
      FRONTEND_URL: http://localhost:3000
      # Plain HTTP on localhost: the refresh cookie can't be Secure here.
      REFRESH_COOKIE_SECURE: "False"
      MEDIA_ROOT: /app/media
      DJANGO_MEDIA_ROOT: /app/media
      AGMARKNET_API_KEY: ${AGMARKNET_API_KEY:-}
    volumes:
      - media:/app/media
    ports:
      - "8000:8000"

  fastapi:
    profiles: ["app"]
    build:
      context: .
      dockerfile: backend-fastapi/Dockerfile
      args:
        WITH_ML: ${WITH_ML:-true}
    image: msme-fastapi
    depends_on:
      django:
        condition: service_started
    environment: *backend-env
    volumes:
      - media:/app/media
    ports:
      - "8001:8001"

  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: web-app/Dockerfile
      args:
        NEXT_PUBLIC_DJANGO_API_URL: http://localhost:8000/api
        NEXT_PUBLIC_FASTAPI_URL: http://localhost:8001/compute
    image: msme-web
    ports:
      - "3000:3000"

volumes:
  pgdata:
  media:
